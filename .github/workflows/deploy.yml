name: Construir y publicar en GitHub Pages

on:
  # Cada vez que se actualiza la rama principal
  push:
    branches: [main]
  # En los pull requests solo se construye, para detectar errores antes de publicar
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: DIAGNOSTICO instalar y construir
        run: |
          set +e
          npm install > /tmp/install.log 2>&1
          ic=$?
          npm run build > /tmp/build.log 2>&1
          bc=$?
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}'; }
          echo "::error title=install-exit-$ic::$(tail -n 15 /tmp/install.log | enc)"
          echo "::error title=build-exit-$bc::$(tail -n 40 /tmp/build.log | enc)"
          exit $((ic+bc))

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
