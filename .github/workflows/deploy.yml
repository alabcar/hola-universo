name: Construir y publicar en GitHub Pages

on:
  # Cada vez que se actualiza la rama principal
  push:
    branches: [main]
  # En los pull requests solo se construye, para detectar errores antes de publicar
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Construir la web
        run: |
          if ! npm run build > build.log 2>&1; then
            cat build.log
            echo "::error title=Fallo al construir la web::$(tail -n 30 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')"
            exit 1
          fi
          cat build.log
      - name: Comprobar que las fórmulas se renderizan
        run: |
          n=$(grep -o 'class="katex"' dist/fase-1/semana-02/index.html | wc -l)
          echo "Fórmulas encontradas en la semana 2: $n"
          if [ "$n" -lt 3 ]; then echo "::error title=Fórmulas::No se renderizan las fórmulas (encontradas: $n)"; exit 1; fi
      - name: Preparar el artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
